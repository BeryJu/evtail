[package]
name = "evtail"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "tail(1) for the Windows Event Log"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6", features = ["derive"] }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    # EVT_VARIANT and SECURITY_ATTRIBUTES are both gated behind this.
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_Threading",
]

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
strip = "debuginfo"
